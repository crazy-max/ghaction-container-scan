name: ci

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  schedule:
    - cron: '0 10 * * *'
  push:
    branches:
      - 'master'
      - 'releases/v*'
    tags:
      - 'v*'
  pull_request:

jobs:
  image:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - alpine:3.9
          - alpine:latest
          - moby/buildkit:master
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      -
        name: Scan for vulnerabilities
        id: scan
        uses: ./
        with:
          image: ${{ matrix.image }}
      -
        name: JSON result
        run: cat ${{ steps.scan.outputs.json }}

  tarball:
    runs-on: ubuntu-26.04
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      -
        name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./tests/fixtures
          outputs: type=docker,dest=/tmp/image.tar
          tags: name/app:latest
          provenance: false
      -
        name: Scan for vulnerabilities
        id: scan
        uses: ./
        with:
          tarball: /tmp/image.tar
      -
        name: JSON result
        run: cat ${{ steps.scan.outputs.json }}

  sarif:
    runs-on: ubuntu-26.04
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      -
        name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./tests/fixtures
          outputs: type=docker,dest=/tmp/image.tar
          tags: name/app:latest
          provenance: false
      -
        name: Scan for vulnerabilities
        id: scan
        uses: ./
        with:
          tarball: /tmp/image.tar
          dockerfile: ./tests/fixtures/Dockerfile
      -
        name: SARIF result
        run: cat ${{ steps.scan.outputs.sarif }}

  annotations:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - alpine:3.9
          - alpine:latest
          - moby/buildkit:master
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      -
        name: Scan for vulnerabilities
        uses: ./
        with:
          image: ${{ matrix.image }}
          annotations: true

  ignore_unfixed:
    runs-on: ubuntu-26.04
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      -
        name: Scan for vulnerabilities
        uses: ./
        with:
          image: alpine:3.9
          ignore_unfixed: true

  threshold:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - alpine:3.9
          - alpine:3.10
          - alpine:latest
          - moby/buildkit:master
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      -
        name: Scan for vulnerabilities
        continue-on-error: true
        uses: ./
        with:
          image: ${{ matrix.image }}
          severity_threshold: HIGH

  build-scan-push:
    runs-on: ubuntu-26.04
    services:
      registry:
        image: registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 5000:5000
    env:
      REPO_SLUG: localhost:5000/name/app
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      -
        name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REPO_SLUG }}
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host
      -
        name: Build and load
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./tests/fixtures
          load: true
          tags: ${{ steps.meta.outputs.tags }}
      -
        name: Scan for vulnerabilities
        uses: ./
        with:
          image: ${{ env.REPO_SLUG }}:${{ steps.meta.outputs.version }}
          dockerfile: ./tests/fixtures/Dockerfile
      -
        name: Build multi-platform and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./tests/fixtures
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
