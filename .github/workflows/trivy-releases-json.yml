name: trivy-releases-json

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'
  push:
    branches:
      - 'master'
  pull_request:

jobs:
  generate:
    uses: crazy-max/.github/.github/workflows/releases-json.yml@46267a6e61cd56aac2fc79943df180152f4c89d6 # v1.10.1
    with:
      repository: aquasecurity/trivy
      artifact_name: trivy-releases-json
      filename: trivy-releases.json

  open-pr:
    runs-on: ubuntu-26.04
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      pull-requests: write
    needs:
      - generate
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      -
        name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trivy-releases-json
          path: .github
      -
        name: Commit changes
        run: |
          git add -A .
      -
        name: Create PR
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          base: master
          branch: bot/trivy-releases-json
          commit-message: "update .github/trivy-releases.json"
          signoff: true
          delete-branch: true
          title: "Update `.github/trivy-releases.json`"
          body: |
            Update `.github/trivy-releases.json` to keep in sync with [https://github.com/aquasecurity/trivy](https://github.com/aquasecurity/trivy).
          draft: false
